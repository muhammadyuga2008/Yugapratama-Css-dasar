<!DOCTYPE html>
<html lang="en">
<head>

    <title>Relative</title>
</head>
<body>
    <style>
        .content{
            background-color: aquamarine;
            width: 200px;
            height: 200px;
            display: inline-block;
        }
        .content2 {
            position: relative;
            top: 20px;
            left: 20px;
            bottom: 20px;
        }
    </style>
    <div class="content content1">
        <h1>COntent 1</h1>
    </div>
    <div class="content content2">
        <h1>COntent 2</h1>
    </div>
    <div class="content content3">
        <h1>COntent 3</h1>
    </div>

</body>
</html>
