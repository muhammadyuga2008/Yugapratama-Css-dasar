<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexGrow</title>
</head>
<body>
    <style>
        .container{
            display: flex;
            flex-direction: row;

        }
        .content{
            background-color: palevioletred;
            border: 2px black solid;
            padding: 10px;
            margin: 10px;
        }
        .small{
            flex-grow: 1; /*flex-grow digunakan untuk menentukan seberapa besar sebuah elemen boleh "melar" (bertambah lebar/tinggi)
                            untuk menghabiskan sisa ruang kosong yang ada di dalam wadahnya (container).*/
        }
        .large{
            flex-grow: 2;  /*flex-grow: 1; pada SEMUA elemen
Artinya: Ruang kosong yang tersisa akan dibagi rata ke semua elemen. Semuanya melar dengan porsi yang sama besar.
Angka berbeda (Misal Elemen A = 1, Elemen B = 2)
Artinya: Elemen B akan mengambil ruang kosong 2 kali lebih banyak daripada Elemen A saat melar.*/
        }
    </style>
    <div class="container">
        <div class="content small">A</div>
        <div class="content large">B</div>
        <div class="content small">C</div>
        <div class="content large">D</div>
    </div>
    
</body>
</html>
